name: epub-mcp

services:
  epub-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epub-mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - EPUB_MCP_TRANSPORT=sse
      - EPUB_MCP_HOST=0.0.0.0
      - EPUB_MCP_PORT=8000
      - EPUB_MCP_ALLOWED_DIR=/library
      - EPUB_MCP_LOG_LEVEL=INFO
      - EPUB_MCP_LOG_DIR=/home/epubmcp/.local/state/epub-mcp/logs
    volumes:
      # Mount sample e-books (or your custom library directory) to /library inside the container
      - ./sample_books:/library:ro
      # Persist application logs
      - epub-mcp-logs:/home/epubmcp/.local/state/epub-mcp/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  epub-mcp-logs:
    driver: local

