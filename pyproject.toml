[project]
name = "epub-mcp"
version = "0.1.8"
description = "An MCP server for reading and querying EPUB e-books. Based on ebook-mcp by onebird."
authors = [{ name = "Patrick Shechet", email = "patrick.shechet@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15.0",
    "html2text>=2025.4.15",
    "pydantic>=2.13.4",
    "fastmcp>=3.4.7",
    "typer>=0.27.1",
    "platformdirs>=4.11.3",
]



[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "uvicorn>=0.52.4",
    "poethepoet>=0.48.0",
    "ruff>=0.16.4",
    "vulture>=2.14",
]


[project.scripts]
epub-mcp = "epub_mcp.main:cli_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epub_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]


[tool.poe.tasks]
lint = "ruff check ."
lint-fix = "ruff check --fix ."
format = "ruff format ."
format-check = "ruff format --check ."
vulture = "vulture src .vulture_whitelist.py"
test = "pytest --cov=epub_mcp --cov-report=term-missing"
coverage = "pytest --cov=epub_mcp --cov-report=term-missing --cov-report=html"

check = ["format-check", "lint", "vulture"]
compose-up = "docker compose up -d --build"
compose-inspector = "docker compose -f docker-compose.yml -f docker-compose.inspector.yml up --build"
compose = "epub_mcp.tools.docker_cli:run_compose"