[project]
name = "ebook-mcp"
version = "0.1.8"
description = "An MCP server for reading and querying EPUB e-books."
authors = [{ name = "onebird", email = "rymrocks@163.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15.0",
    "html2text>=2025.4.15",
    "pydantic>=2.13.4",
    "fastmcp>=3.4.7",
    "typer>=0.27.1",
    "platformdirs>=4.11.3",
]



[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "uvicorn>=0.52.4",
    "poethepoet>=0.48.0",
    "ruff>=0.16.4",
]


[project.scripts]
ebook-mcp = "ebook_mcp.main:cli_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebook_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]


[tool.poe.tasks]
lint = "ruff check ."
lint-fix = "ruff check --fix ."
format = "ruff format ."
format-check = "ruff format --check ."
test = "pytest"
check = ["format-check", "lint"]
compose-up = "docker compose up -d --build"
compose-inspector = "docker compose -f docker-compose.yml -f docker-compose.inspector.yml up --build"
compose = "ebook_mcp.tools.docker_cli:run_compose"