services:
  mcp-inspector:
    image: node:20-alpine
    container_name: mcp-inspector
    command: npx -y @modelcontextprotocol/inspector
    ports:
      - "${MCP_INSPECTOR_PORT:-5173}:5173"
      - "${MCP_INSPECTOR_PROXY_PORT:-5174}:3000"
    environment:
      - HOST=0.0.0.0
    depends_on:
      - ebook-mcp
