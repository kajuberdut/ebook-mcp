services:
  mcp-inspector:
    image: node:22-alpine
    container_name: mcp-inspector
    command: npx --no-warnings --yes @modelcontextprotocol/inspector@latest --config /app/mcp.json
    ports:
      - "${MCP_INSPECTOR_PORT:-6274}:6274"
      - "${MCP_INSPECTOR_PROXY_PORT:-6277}:6277"
      - "${MCP_INSPECTOR_PORT_V1:-5173}:5173"
      - "${MCP_INSPECTOR_PROXY_PORT_V1:-5174}:3000"
    environment:
      - HOST=0.0.0.0
      - NPM_CONFIG_LOGLEVEL=error
      - DANGEROUSLY_OMIT_AUTH=true
      - DANGEROUSLY_BIND_ALL_INTERFACES=true
    volumes:
      - ./.mcp/mcp.json:/app/mcp.json:ro
    depends_on:
      - epub-mcp

